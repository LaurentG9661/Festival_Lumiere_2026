<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival Lumière 2026 — Mon Programme Sur Mesure</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #e50914; text-align: center; }
    .filters { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: center; }
    input, select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box; }
    .checkbox-filter { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; cursor: pointer; user-select: none; }
    .seance-card { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; border-left: 5px solid #e50914; }
    .seance-info h3 { margin: 0 0 5px 0; font-size: 16px; }
    .seance-info p { margin: 0; font-size: 14px; color: #666; }
    .sticky-bar { position: sticky; bottom: 20px; background: #fff; padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; }
    .btn { background: #e50914; color: #fff; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎬 Festival Lumière 2026</h1>
  <p style="text-align:center;">Cochez les séances de votre choix et téléchargez votre agenda sur mesure.</p>

  <!-- BARRE DE FILTRES -->
  <div class="filters">
    <input type="text" id="search" placeholder="🔍 Rechercher un film..." oninput="filtrer()">
    <select id="filter-lieu" onchange="filtrer()">
      <option value="">📍 Tous les lieux</option>
    </select>
    <label class="checkbox-filter">
      <input type="checkbox" id="filter-selection" onchange="filtrer()" style="width: auto;">
      ⭐ Masquer non-sélectionnés
    </label>
  </div>

  <!-- LISTE DES SÉANCES -->
  <div id="list">Chargement des séances...</div>

  <br><br>

  <!-- BARRE D'EXPORT STICKY -->
  <div class="sticky-bar">
    <span><strong id="count">0</strong> séance(s) sélectionnée(s)</span>
    <button id="btn-export" class="btn" onclick="genererICS()" disabled>Télécharger mon .ICS</button>
  </div>
</div>

<script>
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVdaa2KecQUjQiiFpHUJs-zylt95WNg7MfLuYzt9PMp2Z8xmeXe0d8aiGD9QAV7CSHwTwVzJxz5z0y/pub?gid=0&single=true&output=csv';

  let seances = [];
  let selection = new Set();

  // Découpage propre du CSV en tenant compte des guillemets
  function parseCSVLine(text) {
    const regex = /(?:,|\n|^)("(?:(?:"")*|[^"]*)*"|[^,\n]*)/g;
    const matches = [];
    let match;
    while ((match = regex.exec(text)) !== null) {
      let val = match[1];
      if (val.startsWith('"') && val.endsWith('"')) {
        val = val.substring(1, val.length - 1).replace(/""/g, '"');
      }
      matches.push(val.trim());
    }
    return matches;
  }

  async function chargerDonnees() {
    try {
      const response = await fetch(SHEET_CSV_URL);
      const data = await response.text();
      const lines = data.split(/\r?\n/).filter(line => line.trim() !== '');
      
      if (lines.length === 0) return;

      const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase());

      // Identification dynamique des colonnes par leurs noms
      const idxId = headers.findIndex(h => h.includes('id'));
      const idxTitre = headers.findIndex(h => h.includes('titre') || h.includes('film'));
      const idxDebut = headers.findIndex(h => h.includes('debut') || h.includes('début'));
      const idxFin = headers.findIndex(h => h.includes('fin'));
      const idxLieu = headers.findIndex(h => h.includes('lieu'));

      seances = lines.slice(1).map((line, i) => {
        const row = parseCSVLine(line);
        return {
          id: (idxId !== -1 && row[idxId]) ? row[idxId] : `seance-${i}`,
          titre: idxTitre !== -1 ? row[idxTitre] : row[1],
          debut: idxDebut !== -1 ? row[idxDebut] : row[3],
          fin: idxFin !== -1 ? row[idxFin] : row[4],
          lieu: idxLieu !== -1 ? row[idxLieu] : row[5]
        };
      }).filter(s => s.titre && s.lieu);

      remplirFiltreLieux();
      afficher(seances);
    } catch (e) {
      document.getElementById('list').innerHTML = "Erreur de chargement des données. Vérifiez la publication CSV.";
    }
  }

  function remplirFiltreLieux() {
    const lieux = [...new Set(seances.map(s => s.lieu))].filter(Boolean).sort();
    const select = document.getElementById('filter-lieu');
    select.innerHTML = '<option value="">📍 Tous les lieux</option>';
    lieux.forEach(l => {
      select.innerHTML += `<option value="${l}">${l}</option>`;
    });
  }

  function afficher(liste) {
    const container = document.getElementById('list');
    if (liste.length === 0) {
      container.innerHTML = "<p style='text-align:center; color:#888;'>Aucune séance ne correspond à votre recherche.</p>";
      return;
    }
    container.innerHTML = liste.map(s => `
      <div class="seance-card">
        <div class="seance-info">
          <h3>${s.titre}</h3>
          <p>📅 ${s.debut} ${s.fin ? '➔ ' + s.fin : ''}</p>
          <p>📍 ${s.lieu}</p>
        </div>
        <input type="checkbox" ${selection.has(s.id) ? 'checked' : ''} onchange="toggle('${s.id}')" style="transform: scale(1.5); cursor:pointer;">
      </div>
    `).join('');
  }

  function filtrer() {
    const search = document.getElementById('search').value.toLowerCase();
    const lieu = document.getElementById('filter-lieu').value;
    const uniquementSelection = document.getElementById('filter-selection').checked;

    const res = seances.filter(s => {
      const matchSearch = s.titre.toLowerCase().includes(search);
      const matchLieu = (lieu === "" || s.lieu === lieu);
      const matchSelection = !uniquementSelection || selection.has(s.id);
      return matchSearch && matchLieu && matchSelection;
    });

    afficher(res);
  }

  function toggle(id) {
    if (selection.has(id)) selection.delete(id);
    else selection.add(id);
    
    document.getElementById('count').innerText = selection.size;
    document.getElementById('btn-export').disabled = selection.size === 0;

    if (document.getElementById('filter-selection').checked) {
      filtrer();
    }
  }

  function genererICS() {
    let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Festival Lumiere//FR\nX-WR-CALNAME:Mon Festival Lumiere 2026\n";

    seances.filter(s => selection.has(s.id)).forEach(s => {
      const formatICSDate = (str) => {
        if (!str) return '';
        const clean = str.replace(/[- :]/g, '');
        return clean.length >= 12 ? clean.slice(0, 12) + '00Z' : clean;
      };

      ics += `BEGIN:VEVENT\n`;
      ics += `SUMMARY:${s.titre}\n`;
      ics += `LOCATION:${s.lieu}\n`;
      if (s.debut) ics += `DTSTART:${formatICSDate(s.debut)}\n`;
      if (s.fin) ics += `DTEND:${formatICSDate(s.fin)}\n`;
      ics += `END:VEVENT\n`;
    });

    ics += "END:VCALENDAR";

    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'mon_programme_lumiere_2026.ics';
    link.click();
  }

  chargerDonnees();
</script>
</body>
</html>
